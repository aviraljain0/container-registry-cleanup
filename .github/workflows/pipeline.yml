name: Container Registry Cleanup CI/CD

on:
  push:
    branches:
      - main

jobs:
  cleanup-job:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        pip install -r cleanup/requirements.txt

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Pull Docker Image
      run: |
        docker pull ibm1container1cleanup1team/container-registry-cleanup:latest

    - name: Run Docker Container
      run: |
        docker run -d --name cleanup-container \
        -p 5000:5000 \
        ibm1container1cleanup1team/container-registry-cleanup:latest

    - name: Run Cleanup Script
      run: |
        python cleanup/cleanup.py

    - name: Upload Cleanup Log
      uses: actions/upload-artifact@v4
      with:
        name: cleanup-log
        path: cleanup.log