name: Container Registry Cleanup Pipeline

on:
  push:
    branches:
      - main

jobs:
  cleanup-pipeline:
    name: Build Verification and Cleanup
    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cleanup/requirements.txt

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Verify Docker Installation
      - name: Verify Docker Installation
        run: |
          docker --version

      # Pull Docker Image
      - name: Pull Docker Image
        run: |
          docker pull ibm1container1cleanup1team/container-registry-cleanup:latest

      # Display Docker Images
      - name: List Docker Images
        run: |
          docker images

      # Start Container
      - name: Run Docker Container
        run: |
          docker run -d --name cleanup-container \
          -p 5000:5000 \
          ibm1container1cleanup1team/container-registry-cleanup:latest

      # Verify Running Container
      - name: Verify Running Container
        run: |
          docker ps

      # Execute Cleanup Script
      - name: Execute Cleanup Script
        run: |
          python cleanup/cleanup.py

      # Display Cleanup Log
      - name: Display Cleanup Log
        run: |
          cat cleanup.log

      # Upload Log File
      - name: Upload Cleanup Log
        uses: actions/upload-artifact@v4
        with:
          name: Cleanup-Report
          path: cleanup.log

      # Stop Container
      - name: Stop Docker Container
        if: always()
        run: |
          docker stop cleanup-container || true

      # Remove Container
      - name: Remove Docker Container
        if: always()
        run: |
          docker rm cleanup-container || true