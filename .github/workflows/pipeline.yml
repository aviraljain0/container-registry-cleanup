name: Docker Hub Cleanup

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"   

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cleanup/requirements.txt

      # Run Cleanup Script
      - name: Run Cleanup
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          python cleanup/cleanup.py

      # Display Cleanup Log
      - name: Display Cleanup Log
        if: always()
        run: |
          if [ -f cleanup.log ]; then
            cat cleanup.log
          else
            echo "cleanup.log not found."
          fi

      # Upload Cleanup Log
      - name: Upload Cleanup Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cleanup-Report
          path: cleanup.log
          if-no-files-found: warn
